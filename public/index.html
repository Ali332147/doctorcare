.ap{border-top:1px solid var(--line);padding:12px 0}.ap:first-child{border-top:0}
.ap .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.act button{padding:4px 10px;font-size:14px}

 if(D.st){const [i,s]=D.st.split('|');run(async()=>{await api(`/appointments/${i}/status`,{method:'PATCH',body:{status:s}});toast(t('done'));render()})}
 if(D.editdoc)run(async()=>{const {doctor}=await api('/doctors/'+D.editdoc),dl=$('#dlg');dl.innerHTML=`<h3>${t('profile')}</h3>`+profForm(doctor,1);dl.showModal()});
 if(D.call)startCall(D.call);
 if(D.docs){const d=$('#dlg');d.innerHTML=`<h3>${t('f_title')} — ${esc(D.pn)}</h3>`+docsPanel(D.docs)+`<p><button type="button" class="g" data-close>${t('close')}</button></p>`;d.showModal();run(()=>refreshDocs(d.querySelector('.docs')))}
 if(D.fview)window.open('/api/files/'+D.fview,'_blank');
 if(D.fdl)location.href='/api/files/'+D.fdl+'?download=1';
 if(D.fdel&&confirm(t('f_delq')))run(async()=>{await api('/files/'+D.fdel,{method:'DELETE'});await refreshDocs(b.closest('.docs'))});
 if(D.prx)openNewRx(D.prx,D.pn);
 if(D.rx)run(()=>openRx(D.rx,true));if(D.view)run(()=>openRx(D.view,false))});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,v=Object.fromEntries(new FormData(f));
 if(f.id==='fLogin')run(async()=>{user=(await api('/auth/login',{method:'POST',body:v})).user;render()});
 if(f.id==='fReg')run(async()=>{v.language=lang;await api('/auth/register',{method:'POST',body:v});tab='login';render();toast(t('registered'))});
 if(f.classList.contains('fUp'))run(()=>uploadFiles(f));
 if(f.id==='fProf')run(async()=>{await api(`/doctors/${f.dataset.id}/profile`,{method:'PUT',body:v});if($('#dlg').open)$('#dlg').close();toast(t('saved'));if(f.dataset.id===user.id)user=(await api('/me')).user;render()});
 if(f.id==='fDoc')run(async()=>{await api('/admin/doctors',{method:'POST',body:v});toast(t('saved'));render()});
 if(f.id==='fBook')run(async()=>{v.patientAge=Number(v.patientAge);await api('/appointments',{method:'POST',body:v});toast(t('saved'));render()});
 if(f.id==='fRx')run(async()=>{const medicines=collectMeds(f);
  const body={diagnosis:v.diagnosis,medicines,advice:v.advice,followupDate:v.followupDate||null};if(f.dataset.pid)await api(`/admin/patients/${f.dataset.pid}/prescriptions`,{method:'POST',body});else await api(`/appointments/${f.dataset.id}/prescription`,{method:'PUT',body});$('#dlg').close();toast(t('saved'))})});
async function refreshSlots(f){const doc=f.doctorId.value,date=f.appointmentDate.value;let bk=[];if(doc&&date)bk=(await api(`/doctors/${doc}/booked?date=${date}`)).booked;const cur=f.startTime.value;
 f.startTime.innerHTML=`<option value="">${t('select')}</option>`+slots().map(s=>{const bkd=bk.includes(s),past=date===todayStr()&&s<=new Date().toTimeString().slice(0,5);return `<option value="${s}"${bkd||past?' disabled':''}>${tm(s)}${bkd?' ('+t('booked')+')':''}</option>`}).join('');if(cur&&!bk.includes(cur))f.startTime.value=cur}
document.addEventListener('change',e=>{const el=e.target,f=el.form;
 if(el.type==='file'&&f&&f.classList.contains('fUp')){const fl=[...el.files];f.querySelector('.fnames').innerHTML=fl.length?`<b>${fl.length} ${t('f_sel')}</b>`+fl.map(x=>`<div>${esc(x.name)} · ${fmtSize(x.size)}</div>`).join(''):''}if(el.id==='qd'){window.QD=el.value;run(render)}
 if(f&&f.id==='fBook'&&(el.id==='sp'||el.name==='doctorId'||el.name==='appointmentDate')){
  if(el.id==='sp')f.doctorId.innerHTML=`<option value="">${t('chooseDoc')}</option>`+(window.DOCS||[]).filter(d=>!el.value||d.specialty===el.value).map(docOpt).join('');
  run(()=>refreshSlots(f))}});
document.addEventListener('input',e=>{if(e.target.id!=='q')return;const q=e.target.value.toLowerCase();document.querySelectorAll('#pt tr').forEach((r,i)=>{if(i)r.hidden=!r.textContent.toLowerCase().includes(q)})});
window.addEventListener('pageshow',e=>{if(e.persisted)render()});
boot();
</script></body></html>
